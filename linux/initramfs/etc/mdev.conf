# /etc/mdev.conf: busybox mdev's device rules, read by `mdev -s` in rcS and
# for hotplug.  Without this file mdev makes every node root:root 0660, which
# overrides devtmpfs's 0666 on null, zero, … and breaks users other than root
# (cargo starts rustc with stdin on /dev/null: "Permission denied").
# Devices not listed keep that default.
null	0:0 666
zero	0:0 666
full	0:0 666
random	0:0 666
urandom	0:0 666
tty	0:0 666
ptmx	0:0 666
# The board-register device (KLAUSSCPU_MMIO_DEV) stays root-only, as the
# kernel creates it; mdev's default would add group root.
klausscpu-mmio	0:0 600
