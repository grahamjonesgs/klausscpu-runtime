# Doom on the KlaussCPU VGA port only (no VNC, no networking): the fastest
# configuration — Doom's 8-bit frames go straight to the VGA's palette mode,
# double-buffered and flipped at vblank, with no RGB565 conversion.
# Build:  west build ... apps/doom --build-dir build_doom_vga -- -DEXTRA_CONF_FILE=vga.conf <usual -D...>
# No VNC means no keyboard: Doom runs its attract-mode demos.  To play, use
# VNC with the VGA mirror instead (prj.conf or amp.conf + CONFIG_KLAUSSCPU_VGA=y).
# The Kconfig warnings about NET_* symbols from prj.conf are expected.
CONFIG_NETWORKING=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_KLAUSSCPU=n
CONFIG_KLAUSSCPU_VNC_SERVER=n
CONFIG_KLAUSSCPU_VNC_BLIT_SEND=n
CONFIG_KLAUSSCPU_VNC_PROFILE=n
CONFIG_KLAUSSCPU_VGA=y
CONFIG_KLAUSSCPU_VNC_FB_WIDTH=320
CONFIG_KLAUSSCPU_VNC_FB_HEIGHT=200
