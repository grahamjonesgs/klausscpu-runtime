# Doom with VNC served by AMP core 2 (AMP_CORE2_PLAN.md P4b).
# Build:  west build ... apps/doom --build-dir build_doom_amp -- -DEXTRA_CONF_FILE=amp.conf <usual -D...>
# Networking is OFF on this core (core 2 owns the LiteEth and runs lwIP);
# the Kconfig warnings about NET_* symbols from prj.conf are expected.
CONFIG_NETWORKING=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_ETH_KLAUSSCPU=n
CONFIG_KLAUSSCPU_VNC_SERVER=n
CONFIG_KLAUSSCPU_VNC_BLIT_SEND=n
CONFIG_KLAUSSCPU_VNC_PROFILE=n
CONFIG_KLAUSSCPU_AMP_VNC=y
CONFIG_KLAUSSCPU_FRAMEBUFFER=y
CONFIG_KLAUSSCPU_VNC_FB_WIDTH=320
CONFIG_KLAUSSCPU_VNC_FB_HEIGHT=200
