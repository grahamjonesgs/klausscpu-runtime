# ── Core ──────────────────────────────────────────────────────────────────
CONFIG_BOARD_NEXYS_A7=y
CONFIG_XIP=n
CONFIG_DEBUG_INFO=n
CONFIG_SOC_KLAUSSCPU_NEXYS_A7=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_CBPRINTF_FP_A_SUPPORT=n
# Also emit a debug-stripped zephyr.strip (the full zephyr.elf carries ~tens of
# MB of DWARF that never reaches the board; the loaded image is ~1 MB).
CONFIG_BUILD_OUTPUT_STRIPPED=y

# ── UART console (Doom prints status via printf/puts) ─────────────────────
CONFIG_UART_KLAUSSCPU=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# ── Timer (1 kHz tick, matches ssh_shell rationale for the eth RX poll) ───
CONFIG_KLAUSSCPU_TIMER=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# ── Networking (for the VNC link) ─────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_KLAUSSCPU=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
# TCP windows: the default (0) leaves a tiny send window, so VNC frames go out
# nearly one segment at a time, each waiting a full ACK round-trip (~3.4 s for a
# 512 KB frame).  A 32 KB window (fits the 16-bit window field, no scaling) lets
# TCP pipeline many segments before waiting -> ~10x+ throughput.
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768
# 64-bit pointers/longs make every net stack frame larger; give the net threads
# real headroom (same rationale as ssh_shell) and keep the sentinel on.
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
# Known-good buffer counts (this set connected and rendered the splash).  An
# aggressive 4-8x bump broke the handshake, so stay here; the frame-rate cap
# below is the lever for the RX-pkt-exhaustion flood instead.
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_MAX_CONN=24
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_POSIX_MAX_FDS=16

# ── SD card + filesystem (the WAD lives at /SD:/doom1.wad) ────────────────
CONFIG_DISK_ACCESS=y
CONFIG_DISK_KLAUSSCPU_SD=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_REENTRANT=y

# ── VNC (RFB) server — the display.  Doom owns the framebuffer, so disable
#    the built-in demo (test pattern + bouncing box). ──────────────────────
CONFIG_KLAUSSCPU_VNC_SERVER=y
CONFIG_KLAUSSCPU_VNC_DEMO=n
# Offload the send-path framebuffer->sendbuf copy (the "vnc: convert=..ms" line)
# to the 2D DMA blitter, freeing that CPU time for Doom's tick.  A/B knob: set n
# to force the memcpy baseline and compare the convert= figure.
CONFIG_KLAUSSCPU_VNC_BLIT_SEND=y

# Step-0 pipeline instrumentation (render/convert/send/throughput to UART).
# Turn both off once we've read the numbers.
CONFIG_DOOM_PROFILE=y
CONFIG_KLAUSSCPU_VNC_PROFILE=y

# ── Logging (the VNC module uses the log subsystem) ───────────────────────
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_THREAD_NAME=y
# Immediate mode: format at the call site instead of packaging args for a log
# thread.  Avoids the deferred-packaging vararg corruption seen on this 64-bit
# arch (garbled multi-arg lines) and removes the log-thread stack concern.
CONFIG_LOG_MODE_IMMEDIATE=y

# ── Memory ────────────────────────────────────────────────────────────────
# malloc arena = -1: instead of a fixed static array (which the KlaussCPU
# linker would materialise in the image, since its single LOAD segment has
# FileSiz == MemSiz), use all RAM from _end up to _heap_sentry at runtime.  So
# Doom's 16 MiB zone + 1 MiB screen come from the board's ~127 MiB of free RAM
# and cost no image/file space.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
CONFIG_HEAP_MEM_POOL_SIZE=524288
# main runs mount + DHCP (net_mgmt frames are large on this 64-bit core); the
# 16 KiB I tried first overflowed into a wild jump.  Match ssh_shell's 32 KiB.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
