# ── Core ──────────────────────────────────────────────────────────────────
CONFIG_BOARD_NEXYS_A7=y
CONFIG_XIP=n
CONFIG_DEBUG_INFO=n
CONFIG_SOC_KLAUSSCPU_NEXYS_A7=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_CBPRINTF_FP_A_SUPPORT=n

# ── UART ──────────────────────────────────────────────────────────────────
CONFIG_UART_KLAUSSCPU=y
CONFIG_UART_CONSOLE=y

# ── Timer ─────────────────────────────────────────────────────────────────
CONFIG_KLAUSSCPU_TIMER=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000
# 1 kHz tick (was 100 Hz = 10 ms).  The eth RX driver polls with
# k_sleep(K_MSEC(1)), which rounds up to one tick — at 100 Hz that's a 10 ms
# poll, long enough for the 2-slot RX ring to overflow under broadcast load and
# drop single reply packets (ping/NTP replies).  1 kHz -> ~1 ms RX poll.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# ── Networking ────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_KLAUSSCPU=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
# SNTP (network time) + DNS so file timestamps are real (no RTC on the board).
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y
# Network diagnostics shell: `net iface` / `net ping <ip>` / `net dns <host>` /
# `net route` / `net stats`.  NET_SHELL selects REQUIRES_FLOAT_PRINTF (ping RTT
# uses %f), so enable FP printf (soft-FP is available via compiler-rt).
CONFIG_NET_SHELL=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NET_STATISTICS=y
# KlaussCPU's 64-bit pointers/longs make every stack frame larger than on a
# 32-bit target, so several stock net thread stacks overflow during packet
# processing and silently corrupt neighbouring memory (this manifested as a
# mangled node in a socket recv-queue poll list -> DNS/SNTP responses never
# dispatched).  The net RX traffic-class thread (rx_q[0], CONFIG_NET_RX_STACK_SIZE)
# overflowed handling an inbound packet.  Give the net + socket-service threads
# real headroom, and keep STACK_SENTINEL on to panic-name any future overflow.
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
# tcp_work queue: overflowed during the wolfSSH handshake's TCP churn (the TCP
# state machine + net_pkt processing on 64-bit frames).  Default (~1200) is far
# too small here; size it with the rest.  HTTP + SFTP add more TCP load too.
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y

# Network buffers.  lwIP works on this same board with a 2-slot ring, so the RX
# bottleneck is here, not the HW: the stock pools were ~5 full frames
# (BUF_RX_COUNT=32 x 256B; a 1500B frame needs 6 bufs), which the /22 broadcast
# burst exhausts -> net_pkt alloc fails -> frames (incl. replies) discarded.
# One 1536B buffer per frame + generous counts (RAM is plentiful).
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_BUF_DATA_SIZE=1536

# Logging — deferred mode: a dedicated log thread drains a buffer to the
# backends, instead of each LOG_* call formatting/writing synchronously on the
# calling thread.  This is required now that logs are also persisted to the SD
# card (CONFIG_LOG_BACKEND_FS below): immediate-mode SD writes would block the
# net/server/SSH threads on every log line.  Trade-off: UART boot messages are
# slightly less real-time than before, and under a heavy burst the deferred
# buffer can drop (rather than block) — size LOG_BUFFER_SIZE accordingly.
# (Log output does NOT reach the shell/SSH sessions — CONFIG_SHELL_LOG_BACKEND=n;
# it goes to the UART and the SD file backends only.)
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_NET_LOG=y

# Persist logs to the SD card so they can be inspected after the fact (download
# over SFTP/HTTP or `cat /SD:/log/klaus_0000`).  Additive with the UART backend.
# The backend creates /SD:/log itself (fs_mkdir) and names files PREFIX + a
# 4-digit index with no extension: /SD:/log/klaus_0000, klaus_0001, ...  It can
# only write once /SD: is mounted (see mount_sd() in main.c); earlier lines reach
# the UART only.  Files rotate at FILE_SIZE, keeping FILES_LIMIT of them.
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_DIR="/SD:/log"
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="klaus_"
CONFIG_LOG_BACKEND_FS_FILE_SIZE=65536
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=4

# ── SD card + filesystem ─────────────────────────────────────────────────
CONFIG_DISK_ACCESS=y
CONFIG_DISK_KLAUSSCPU_SD=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_BSS=y
# `ls` calls FatFs f_stat directly (for timestamps) outside Zephyr's fs lock;
# reentrancy makes that safe against concurrent SD access from another session.
CONFIG_FS_FATFS_REENTRANT=y

# ── Shell (UART console) ─────────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Log to the UART backend directly, NOT via the shell's log backend.  The shell
# backend processes logs on the shell thread, which is starved during boot/net
# init, so messages buffer and only flush after DHCP.  Driving the UART backend
# from the deferred log thread instead keeps boot/early messages flowing.  (This
# also means logs never appear in the shell/SSH sessions — only on the UART and
# in the SD log files.)
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL_LOG_BACKEND=n
# Per-session prompt shows the cwd (set via shell_prompt_change).  40 is the
# Kconfig max for this buffer; cwds longer than ~36 chars are truncated with a
# leading '<' in shell_prompt_sync() (shell_paths.c).
CONFIG_SHELL_PROMPT_CHANGE=y
CONFIG_SHELL_PROMPT_BUFF_SIZE=40
CONFIG_DEVMEM_SHELL=n
CONFIG_KLAUSSCPU_SHELL_CMDS=y

# ── wolfSSL + wolfSSH (built from source as Zephyr modules) ──────────────
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_BUILTIN=y
CONFIG_WOLFSSL_SETTINGS_FILE="user_settings.h"
CONFIG_WOLFSSH=y
CONFIG_WOLFSSH_SETTINGS_FILE="user_settings.h"
CONFIG_WOLFSSH_SFTP_DEFAULT_DIR="/SD:"

# ── SSH server ────────────────────────────────────────────────────────────
CONFIG_KLAUSSCPU_SSH_SERVER=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# ── HTTP file server (raw socket, :80, serves /SD:) ───────────────────────
# Kernel-resident and auto-started at boot (like httpsd below).  The *backend*
# API logic (/api/*) is the loadable part — webapi.c is a dispatcher to a
# handler that the apibackend.llext extension registers at runtime (svc load).
CONFIG_KLAUSSCPU_HTTP_SERVER=y

# ── HTTPS file server (HTTP over TLS via wolfSSL, :443, serves /SD:) ───────
# Self-signed ECDSA P-256 cert generated on first boot and persisted to /SD:.
# TLS 1.2 + 1.3; reuses the HTTP request dispatch and wolfSSL (already built
# for SSH).
CONFIG_KLAUSSCPU_HTTPS_SERVER=y

# ── VNC (RFB) server (:5900, serves an in-RAM RGB565 framebuffer) ─────────
# Remote graphics without VGA hardware — connect with macOS Screen Sharing,
# TigerVNC or RealVNC.  Currently shows a built-in test pattern.
CONFIG_KLAUSSCPU_VNC_SERVER=y

# Socket/fd/context headroom.  Three TCP listeners (SSH :22, HTTP :80, HTTPS
# :443) + up to SSH_MAX_CONNS (5) SSH sessions + the HTTP/HTTPS accepted sockets
# + DNS/UDP must coexist — and a browser opens several parallel connections and a
# busy dashboard churns connections that linger in TIME_WAIT, so the pools need
# real slack.  Every TCP listener AND connection (incl. TIME_WAIT) consumes a
# net_conn; running out yields "Not enough connection contexts. Consider
# increasing CONFIG_NET_MAX_CONN" and new connections (curl) can't be accepted.
# Sized generously (126 MB RAM); the deeper fix for connection back-pressure is
# concurrent HTTP/HTTPS workers (see plan), but headroom prevents the stall.
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_POSIX_MAX_FDS=48
CONFIG_NET_MAX_CONTEXTS=48
CONFIG_NET_MAX_CONN=48
CONFIG_NET_SOCKETS_POLL_MAX=12

# ── LLEXT (runtime-loadable extensions; `run` command) ───────────────────
CONFIG_LLEXT=y
CONFIG_LLEXT_TYPE_ELF_OBJECT=y
CONFIG_LLEXT_HEAP_SIZE=256
# Quiet the per-relocation load trace on the UART; warnings/errors still show.
CONFIG_LLEXT_LOG_LEVEL_WRN=y
# Per-thread stdio routing for concurrent `run`s keys off thread custom data.
CONFIG_THREAD_CUSTOM_DATA=y

# libc malloc arena for extensions (minimal libc defaults this to 0 = no heap).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2097152

# ── Memory (126 MB RAM available — be generous) ──────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=524288
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
# Shell-core thread stack. Each shell instance (serial + one per SSH slot) gets
# this. `run` executes loaded llext programs on the shell thread, so it must be
# large enough for the program + its callees (was the 40 KB SSH conn stack).
CONFIG_SHELL_STACK_SIZE=40960
# Deferred-mode log thread now also writes to the SD card (FatFs) via the FS
# backend, so it needs more than the 2048 that sufficed for UART-only output.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
