# ── Core ──────────────────────────────────────────────────────────────────
CONFIG_BOARD_NEXYS_A7=y
CONFIG_XIP=n
CONFIG_DEBUG_INFO=n
CONFIG_SOC_KLAUSSCPU_NEXYS_A7=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_CBPRINTF_FP_A_SUPPORT=n

# ── UART console ──────────────────────────────────────────────────────────
CONFIG_UART_KLAUSSCPU=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# ── Timer (1 kHz tick) ────────────────────────────────────────────────────
CONFIG_KLAUSSCPU_TIMER=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# ── Networking (for the VNC link) ─────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_KLAUSSCPU=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_MAX_CONN=24
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_POSIX_MAX_FDS=16

# ── VNC server + framebuffer-as-display (LVGL renders into it) ────────────
CONFIG_KLAUSSCPU_VNC_SERVER=y
CONFIG_KLAUSSCPU_VNC_DEMO=n
CONFIG_DISPLAY=y
CONFIG_KLAUSSCPU_VNC_DISPLAY=y
# Print periodic "vnc: convert=.. send=.. KB/s" so the blit-sleep parallelism
# win is measurable while interacting (busy-spin vs sleep A/B).
CONFIG_KLAUSSCPU_VNC_PROFILE=y

# ── LVGL ──────────────────────────────────────────────────────────────────
CONFIG_LVGL=y
# RGB565, matches the framebuffer
CONFIG_LV_COLOR_DEPTH_16=y
# LVGL object heap (static)
CONFIG_LV_Z_MEM_POOL_SIZE=262144
# Full-screen draw buffer: a full redraw flushes ONCE, so the blitter does one
# copy + one whole-cache flush/invalidate per frame (the maintenance is
# per-cache, not per-region — batching it matters).  Static buffer in .lvgl_buf
# (~600 KB at 16 bpp), trivial in 128 MB RAM.  Partial UI updates still flush
# only their dirty area (no LV_Z_FULL_REFRESH).
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BTN=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_BAR=y
# Windowed desktop demo: draggable windows, live activity chart, arc gauge
CONFIG_LV_USE_WIN=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# ── Logging (immediate avoids the deferred-packaging garble on this core) ──
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_THREAD_NAME=y

# ── Render micro-benchmark (prints per-op ms/frame at boot) ───────────────
CONFIG_GUI_LVGL_BENCHMARK=y

# ── Memory ────────────────────────────────────────────────────────────────
# Word-wise (speed) memcpy/memset instead of the default byte-at-a-time size
# build — the framebuffer flush copy is memcpy-bound, so this alone should cut
# it sharply on this high-CPI core.
CONFIG_MINIMAL_LIBC_OPTIMIZE_STRING_FOR_SIZE=n
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
