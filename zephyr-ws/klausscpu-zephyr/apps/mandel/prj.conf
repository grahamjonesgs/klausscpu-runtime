# Mandelbrot zoom over VNC — single-core build (core 1 computes AND runs the
# TCP/IP stack + VNC server).  Add amp.conf for the two-core build.

# ── Core ──────────────────────────────────────────────────────────────────
CONFIG_BOARD_NEXYS_A7=y
CONFIG_XIP=n
CONFIG_DEBUG_INFO=n
CONFIG_SOC_KLAUSSCPU_NEXYS_A7=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_CBPRINTF_FP_A_SUPPORT=n
CONFIG_BUILD_OUTPUT_STRIPPED=y

# ── UART console ──────────────────────────────────────────────────────────
CONFIG_UART_KLAUSSCPU=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# ── Timer ─────────────────────────────────────────────────────────────────
CONFIG_KLAUSSCPU_TIMER=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# ── Networking (VNC link) — same known-good set as apps/doom ───────────────
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_KLAUSSCPU=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=32768
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=8192
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_MAX_CONN=24
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_POSIX_MAX_FDS=16

# ── VNC server — the display (320x200 RGB565 framebuffer) ────────────────
CONFIG_KLAUSSCPU_VNC_SERVER=y
CONFIG_KLAUSSCPU_VNC_DEMO=n
CONFIG_KLAUSSCPU_VNC_FB_WIDTH=320
CONFIG_KLAUSSCPU_VNC_FB_HEIGHT=200
CONFIG_KLAUSSCPU_VNC_BLIT_SEND=y

# ── Logging ───────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_THREAD_NAME=y
CONFIG_LOG_MODE_IMMEDIATE=y

# ── Memory ────────────────────────────────────────────────────────────────
# Frame buffers come from malloc (arena = all free RAM at runtime), not static
# arrays, which this port's linker would materialise in the image.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
CONFIG_HEAP_MEM_POOL_SIZE=524288
CONFIG_MINIMAL_LIBC_OPTIMIZE_STRING_FOR_SIZE=n
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# KlaussCPU VGA port: also show the framebuffer on a monitor (KlaussCPU VGA_PLAN.md).
CONFIG_KLAUSSCPU_VGA=y
