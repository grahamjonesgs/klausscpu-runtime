# MicroPython (ports/zephyr) on the Nexys A7: board settings on top of the
# port's prj.conf.  Passed as EXTRA_CONF_FILE by tools/validate/zephyr/build.sh.

CONFIG_MICROPY_CONFIGFILE="mpconfigport_klausscpu.h"
CONFIG_KLAUSSCPU_LIBC_EXTRAS=y
CONFIG_MICROPY_HEAP_SIZE=4194304
CONFIG_MAIN_STACK_SIZE=65536

# 1 kHz tick: console_poll.c drains the UART's 16-byte RX FIFO every tick,
# and time.sleep_ms() gets 1 ms resolution (a tick costs ~280 cycles, 0.3%).
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# No FPU (soft float), no BT, sensors, watchdog or interrupt-driven UART.
# UART_CONSOLE_DEBUG_SERVER_HOOKS stays on: src/zephyr_getchar.c needs its
# declarations to compile, although console_poll.c replaces it at link.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_FPU=n
CONFIG_SENSOR=n
CONFIG_WATCHDOG=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_LINE_CTRL=n
CONFIG_UART_USE_RUNTIME_CONFIGURE=n
CONFIG_CONSOLE_HANDLER=n
CONFIG_BUILD_OUTPUT_HEX=n

# The SD card is FatFs through Zephyr; MicroPython's own FAT VFS needs
# !FAT_FILESYSTEM_ELM and a block device, so leave the VFS for later.
CONFIG_MICROPY_VFS_FAT=n
CONFIG_MICROPY_VFS_LFS2=n

# Networking: the board's Ethernet, DHCP, IPv4 only.
CONFIG_NET_IPV6=n
CONFIG_NET_CONFIG_NEED_IPV6=n
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_KLAUSSCPU=y
# Address, gateway and DNS server all from DHCP: drop the port's static
# 192.0.2.x settings (its DNS server would take the only resolver slot), and
# wait up to 10 s for the lease at boot.
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_MY_IPV4_GW=""
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_CONFIG_INIT_TIMEOUT=10

# Room for sockets: the port's defaults (4 TCP connections, 6 contexts) run
# out after a couple of sockets that wait for the GC to be closed.  Buffer
# counts as ssh_shell's (transfer speed).
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=96
CONFIG_NET_BUF_RX_COUNT=192
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_NET_BUF_DATA_SIZE=1536
